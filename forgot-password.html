<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Waste Wise</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
  body{ background:var(--color-paper-100); display:grid; place-items:center; min-height:100vh; padding:24px}
  .card{ width:100%; max-width:420px; background:#fff; border:1.5px solid var(--color-line); border-radius:20px; padding:28px; box-shadow:var(--shadow-lg); text-align:center}
  .eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.18em; color:var(--color-slate-500)}
  h2{ font-family:var(--font-display); font-size:22px; letter-spacing:-.02em; margin-top:6px}
  p{ font-family:var(--font-mono); font-size:11px; color:var(--color-slate-600); margin-top:8px; line-height:1.6}
  input{ width:100%; margin-top:14px; padding:12px 14px; border:1.5px solid var(--color-border); border-radius:12px; background:var(--color-paper-50); font-family:var(--font-mono); font-size:13px; outline:none}
  input:focus{ border-color:var(--color-ink-950); box-shadow:0 0 0 3px rgba(214,255,42,.25)}
  button{ width:100%; margin-top:14px; padding:13px; border-radius:999px; font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; font-weight:700; cursor:pointer; border:1.5px solid var(--color-ink-950); background:var(--color-ink-950); color:var(--color-acid-400)}
  button:hover{ background:var(--color-acid-400); color:var(--color-ink-950)}
  a{ display:inline-block; margin-top:14px; font-family:var(--font-mono); font-size:11px; color:var(--color-slate-600); text-decoration:underline; text-underline-offset:3px}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h2>Reset password</h2>
  <p>Enter your account email — we'll send a reset link via Firebase Auth.</p>
  <input type="email" id="resetEmail" placeholder="you@wastewise.com" required>
  <button id="resetButton">Send reset link →</button>
  <a href="login.html">← Back to Login</a>
</div>
<script type="module" src="forgot-password.js"></script>
</body>
</html>
