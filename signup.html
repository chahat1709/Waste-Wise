<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join — Waste Wise</title>
<link rel="stylesheet" href="design-tokens.css">
<style>
  body{ background:var(--color-paper-100); display:grid; place-items:center; min-height:100vh; padding:24px}
  .card{ width:100%; max-width:420px; background:#fff; border:1.5px solid var(--color-line); border-radius:20px; padding:28px; box-shadow:var(--shadow-lg); text-align:center}
  .logo{ width:56px; height:56px; object-fit:contain; margin:0 auto 10px; display:block}
  h2{ font-family:var(--font-display); font-size:22px; letter-spacing:-.02em}
  p{ font-family:var(--font-mono); font-size:11px; color:var(--color-slate-600)}
  input{ width:100%; margin-top:12px; padding:12px 14px; border:1.5px solid var(--color-border); border-radius:12px; background:var(--color-paper-50); font-family:var(--font-mono); font-size:13px; outline:none}
  input:focus{ border-color:var(--color-ink-950); box-shadow:0 0 0 3px rgba(214,255,42,.25)}
  .btn{ width:100%; margin-top:14px; padding:13px; border-radius:999px; font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; font-weight:700; cursor:pointer; border:1.5px solid var(--color-ink-950)}
  .signup-btn{ background:var(--color-ink-950); color:var(--color-acid-400)}
  .signup-btn:hover{ background:var(--color-acid-400); color:var(--color-ink-950)}
  .google-btn{ background:#fff; color:var(--color-ink-950); display:flex; gap:8px; justify-content:center; align-items:center}
  a{ color:var(--color-ink-950); text-decoration:underline; text-underline-offset:3px}
</style>
</head>
<body>
<div class="card">
  <img src="logo.png" alt="Waste Wise" class="logo">
  <h2>Join Waste Wise</h2>
  <p style="margin-top:6px">Paper · ink · acid — create your field account</p>
  <input type="text" id="signup-name" placeholder="Full Name">
  <input type="email" id="signup-email" placeholder="Email">
  <input type="password" id="signup-password" placeholder="Password">
  <button id="signup-btn" class="btn signup-btn">Create account →</button>
  <p style="margin:12px 0">OR</p>
  <button id="google-signup" class="btn google-btn">Sign up with Google</button>
  <p style="margin-top:14px">Already have an account? <a href="login.html">Login</a></p>
</div>
<script src="signup-auth.js" type="module"></script>
</body>
</html>
